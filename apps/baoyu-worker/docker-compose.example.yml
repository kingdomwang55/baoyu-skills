services:
  baoyu-worker:
    build:
      context: ../..
      dockerfile: apps/baoyu-worker/Dockerfile
    ports:
      - "8787:8787"
    environment:
      # Worker runtime
      BAOYU_WORKER_TOKEN: "${BAOYU_WORKER_TOKEN:-change-me}"
      BAOYU_WORKER_DATA_DIR: "${BAOYU_WORKER_DATA_DIR:-/data}"
      BAOYU_CHROME_PROFILE_DIR: "${BAOYU_CHROME_PROFILE_DIR:-/data/chrome-profile}"
      PORT: "${PORT:-8787}"
      HOST: "${HOST:-0.0.0.0}"

      # OpenAI-compatible endpoints, gateways, and Coding Plan providers
      OPENAI_API_KEY: "${OPENAI_API_KEY:-}"
      OPENAI_BASE_URL: "${OPENAI_BASE_URL:-}"
      OPENAI_IMAGE_MODEL: "${OPENAI_IMAGE_MODEL:-}"
      OPENAI_IMAGE_API_DIALECT: "${OPENAI_IMAGE_API_DIALECT:-}"
      OPENAI_IMAGE_USE_CHAT: "${OPENAI_IMAGE_USE_CHAT:-}"

      # Google / Gemini API provider
      GOOGLE_API_KEY: "${GOOGLE_API_KEY:-}"
      GEMINI_API_KEY: "${GEMINI_API_KEY:-}"
      GOOGLE_BASE_URL: "${GOOGLE_BASE_URL:-}"
      GOOGLE_IMAGE_MODEL: "${GOOGLE_IMAGE_MODEL:-}"

      # OpenRouter and compatible gateways
      OPENROUTER_API_KEY: "${OPENROUTER_API_KEY:-}"
      OPENROUTER_BASE_URL: "${OPENROUTER_BASE_URL:-}"
      OPENROUTER_HTTP_REFERER: "${OPENROUTER_HTTP_REFERER:-}"
      OPENROUTER_TITLE: "${OPENROUTER_TITLE:-}"
      OPENROUTER_IMAGE_MODEL: "${OPENROUTER_IMAGE_MODEL:-}"

      # DashScope / Alibaba
      DASHSCOPE_API_KEY: "${DASHSCOPE_API_KEY:-}"
      DASHSCOPE_BASE_URL: "${DASHSCOPE_BASE_URL:-}"
      DASHSCOPE_IMAGE_MODEL: "${DASHSCOPE_IMAGE_MODEL:-}"

      # Volcengine Ark / Seedream / Jimeng
      ARK_API_KEY: "${ARK_API_KEY:-}"
      SEEDREAM_BASE_URL: "${SEEDREAM_BASE_URL:-}"
      SEEDREAM_IMAGE_MODEL: "${SEEDREAM_IMAGE_MODEL:-}"
      JIMENG_ACCESS_KEY_ID: "${JIMENG_ACCESS_KEY_ID:-}"
      JIMENG_SECRET_ACCESS_KEY: "${JIMENG_SECRET_ACCESS_KEY:-}"
      JIMENG_REGION: "${JIMENG_REGION:-}"
      JIMENG_BASE_URL: "${JIMENG_BASE_URL:-}"
      JIMENG_IMAGE_MODEL: "${JIMENG_IMAGE_MODEL:-}"

      # Z.AI / BigModel
      ZAI_API_KEY: "${ZAI_API_KEY:-}"
      BIGMODEL_API_KEY: "${BIGMODEL_API_KEY:-}"
      ZAI_BASE_URL: "${ZAI_BASE_URL:-}"
      BIGMODEL_BASE_URL: "${BIGMODEL_BASE_URL:-}"
      ZAI_IMAGE_MODEL: "${ZAI_IMAGE_MODEL:-}"
      BIGMODEL_IMAGE_MODEL: "${BIGMODEL_IMAGE_MODEL:-}"

      # MiniMax
      MINIMAX_API_KEY: "${MINIMAX_API_KEY:-}"
      MINIMAX_BASE_URL: "${MINIMAX_BASE_URL:-}"
      MINIMAX_IMAGE_MODEL: "${MINIMAX_IMAGE_MODEL:-}"

      # Azure OpenAI
      AZURE_OPENAI_API_KEY: "${AZURE_OPENAI_API_KEY:-}"
      AZURE_OPENAI_BASE_URL: "${AZURE_OPENAI_BASE_URL:-}"
      AZURE_OPENAI_DEPLOYMENT: "${AZURE_OPENAI_DEPLOYMENT:-}"
      AZURE_OPENAI_IMAGE_MODEL: "${AZURE_OPENAI_IMAGE_MODEL:-}"
      AZURE_API_VERSION: "${AZURE_API_VERSION:-}"

      # Replicate
      REPLICATE_API_TOKEN: "${REPLICATE_API_TOKEN:-}"
      REPLICATE_BASE_URL: "${REPLICATE_BASE_URL:-}"
      REPLICATE_IMAGE_MODEL: "${REPLICATE_IMAGE_MODEL:-}"

      # Codex image wrapper
      CODEX_HOME: "${CODEX_HOME:-}"
      BAOYU_CODEX_IMAGEGEN_BIN: "${BAOYU_CODEX_IMAGEGEN_BIN:-}"
      BAOYU_CODEX_IMAGEGEN_TIMEOUT_MS: "${BAOYU_CODEX_IMAGEGEN_TIMEOUT_MS:-}"
      BAOYU_CODEX_IMAGEGEN_RETRIES: "${BAOYU_CODEX_IMAGEGEN_RETRIES:-}"
      BAOYU_IMAGE_GEN_MAX_WORKERS: "${BAOYU_IMAGE_GEN_MAX_WORKERS:-}"

      # Gemini Web browser-auth skill
      GEMINI_WEB_DATA_DIR: "${GEMINI_WEB_DATA_DIR:-}"
      GEMINI_WEB_COOKIE_PATH: "${GEMINI_WEB_COOKIE_PATH:-}"
      GEMINI_WEB_CHROME_PROFILE_DIR: "${GEMINI_WEB_CHROME_PROFILE_DIR:-}"
      GEMINI_WEB_CHROME_PATH: "${GEMINI_WEB_CHROME_PATH:-}"
      GEMINI_WEB_LOGIN: "${GEMINI_WEB_LOGIN:-}"
      GEMINI_WEB_FORCE_LOGIN: "${GEMINI_WEB_FORCE_LOGIN:-}"

      # X / Twitter fetch and browser workflows
      X_AUTH_TOKEN: "${X_AUTH_TOKEN:-}"
      X_CT0: "${X_CT0:-}"
      X_GUEST_TOKEN: "${X_GUEST_TOKEN:-}"
      X_TWID: "${X_TWID:-}"
      X_BEARER_TOKEN: "${X_BEARER_TOKEN:-}"
      X_USER_AGENT: "${X_USER_AGENT:-}"
      X_CLIENT_TRANSACTION_ID: "${X_CLIENT_TRANSACTION_ID:-}"
      X_DATA_DIR: "${X_DATA_DIR:-}"
      X_COOKIE_PATH: "${X_COOKIE_PATH:-}"
      X_CHROME_PROFILE_DIR: "${X_CHROME_PROFILE_DIR:-}"
      X_BROWSER_PROFILE_DIR: "${X_BROWSER_PROFILE_DIR:-}"
      X_BROWSER_CHROME_PATH: "${X_BROWSER_CHROME_PATH:-}"

      # WeChat / Weibo / YouTube workflow helpers
      WECHAT_APP_ID: "${WECHAT_APP_ID:-}"
      WECHAT_APP_SECRET: "${WECHAT_APP_SECRET:-}"
      WECHAT_BROWSER_PROFILE_DIR: "${WECHAT_BROWSER_PROFILE_DIR:-}"
      WECHAT_BROWSER_CHROME_PATH: "${WECHAT_BROWSER_CHROME_PATH:-}"
      WEIBO_BROWSER_PROFILE_DIR: "${WEIBO_BROWSER_PROFILE_DIR:-}"
      WEIBO_BROWSER_CHROME_PATH: "${WEIBO_BROWSER_CHROME_PATH:-}"
      YOUTUBE_TRANSCRIPT_COOKIES_FROM_BROWSER: "${YOUTUBE_TRANSCRIPT_COOKIES_FROM_BROWSER:-}"
      TELEGRAM_BOT_TOKEN: "${TELEGRAM_BOT_TOKEN:-}"
      TELEGRAM_CHAT_ID: "${TELEGRAM_CHAT_ID:-}"
      XDG_CONFIG_HOME: "${XDG_CONFIG_HOME:-}"

      # Network proxy for providers and media downloads
      HTTP_PROXY: "${HTTP_PROXY:-}"
      HTTPS_PROXY: "${HTTPS_PROXY:-}"
      ALL_PROXY: "${ALL_PROXY:-}"
    volumes:
      - baoyu-worker-data:/data
    restart: unless-stopped

volumes:
  baoyu-worker-data:
